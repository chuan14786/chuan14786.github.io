<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>業績報告產生器 | Bill Liu</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', 'PingFang TC', sans-serif;
    background: #0f1117;
    color: #e2e8f0;
    min-height: 100vh;
  }

  .topbar {
    background: #1a1d27;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }

  .back-link {
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    font-size: 0.82rem;
    transition: color 0.2s;
  }
  .back-link:hover { color: rgba(255,255,255,0.9); }
  .topbar h1 { font-size: 1.05rem; font-weight: 600; color: #fff; }

  .workspace {
    display: grid;
    grid-template-columns: 420px 1fr;
    min-height: calc(100vh - 57px);
  }

  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
    .preview-panel { display: none; }
    .preview-panel.show { display: block; }
  }

  /* Input panel */
  .input-panel {
    background: #1a1d27;
    border-right: 1px solid rgba(255,255,255,0.07);
    padding: 1.5rem;
    overflow-y: auto;
  }

  .section-title {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.35);
    margin: 1.5rem 0 0.8rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .section-title:first-child { margin-top: 0; }

  .field { margin-bottom: 0.9rem; }

  .field label {
    display: block;
    font-size: 0.78rem;
    color: rgba(255,255,255,0.5);
    margin-bottom: 0.35rem;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #e2e8f0;
    padding: 0.5rem 0.75rem;
    border-radius: 7px;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus { border-color: rgba(99,102,241,0.5); }
  .field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .field select option { background: #1a1d27; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  .hint {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.28);
    margin-top: 0.25rem;
  }

  .gen-btn {
    width: 100%;
    background: #6366f1;
    color: #fff;
    border: none;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 1.2rem;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .gen-btn:hover { background: #4f46e5; }

  .print-btn {
    width: 100%;
    background: rgba(52,211,153,0.12);
    color: #34d399;
    border: 1px solid rgba(52,211,153,0.3);
    padding: 0.55rem 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.6rem;
    transition: all 0.2s;
  }
  .print-btn:hover { background: rgba(52,211,153,0.2); }

  /* Preview panel */
  .preview-panel {
    background: #f8f8f6;
    overflow-y: auto;
    padding: 3rem;
  }

  /* Report styles (light, print-ready) */
  .report {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
    overflow: hidden;
    font-family: 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif;
    color: #1a1a2e;
  }

  .report-header {
    background: linear-gradient(135deg, #1e1b4b, #312e81);
    color: #fff;
    padding: 2.5rem 2.5rem 2rem;
  }

  .report-logo {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.6;
    margin-bottom: 1rem;
  }

  .report-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }

  .report-subtitle {
    font-size: 0.88rem;
    opacity: 0.7;
  }

  .report-meta {
    display: flex;
    gap: 2rem;
    margin-top: 1.5rem;
    flex-wrap: wrap;
  }

  .report-meta-item { opacity: 0.75; font-size: 0.8rem; }
  .report-meta-item strong { display: block; font-size: 1rem; opacity: 1; margin-bottom: 0.2rem; }

  .report-body { padding: 2rem 2.5rem; }

  .kpi-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .kpi-box {
    border: 2px solid #e8e8e8;
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
  }

  .kpi-box.highlight { border-color: #6366f1; background: #f5f3ff; }
  .kpi-box .kv { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; }
  .kpi-box .kl { font-size: 0.72rem; color: #888; margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .kpi-box .kd { font-size: 0.78rem; margin-top: 0.2rem; font-weight: 600; }
  .kd.up   { color: #059669; }
  .kd.down { color: #dc2626; }
  .kd.same { color: #888; }

  .report-section { margin-bottom: 1.8rem; }

  .report-section h3 {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6366f1;
    border-bottom: 2px solid #6366f1;
    padding-bottom: 0.4rem;
    margin-bottom: 1rem;
  }

  .progress-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
  }

  .progress-table th {
    text-align: left;
    background: #f4f4f8;
    padding: 0.6rem 0.8rem;
    color: #555;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .progress-table td {
    padding: 0.65rem 0.8rem;
    border-bottom: 1px solid #f0f0f0;
    color: #333;
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.75em;
    font-weight: 600;
  }
  .badge.good { background: #d1fae5; color: #065f46; }
  .badge.warn { background: #fef3c7; color: #92400e; }
  .badge.bad  { background: #fee2e2; color: #991b1b; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.6rem;
    font-size: 0.82rem;
  }
  .bar-name { width: 90px; flex-shrink: 0; color: #444; }
  .bar-track {
    flex: 1;
    height: 7px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-val { width: 40px; text-align: right; color: #555; flex-shrink: 0; font-weight: 600; }

  .highlight-list {
    list-style: none;
    padding: 0;
  }

  .highlight-list li {
    padding: 0.5rem 0.5rem 0.5rem 1.2rem;
    position: relative;
    color: #444;
    font-size: 0.86rem;
    line-height: 1.55;
    border-bottom: 1px solid #f5f5f5;
  }

  .highlight-list li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: #6366f1;
    font-size: 0.85em;
  }

  .action-box {
    background: #f9f9ff;
    border: 1px solid #e0e0f0;
    border-radius: 8px;
    padding: 1.1rem 1.3rem;
  }

  .action-item {
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
    margin-bottom: 0.7rem;
    font-size: 0.84rem;
    color: #333;
  }
  .action-item:last-child { margin-bottom: 0; }

  .action-num {
    background: #6366f1;
    color: #fff;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 0.72rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .report-footer {
    background: #f4f4f8;
    border-top: 1px solid #eee;
    padding: 1rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.76rem;
    color: #999;
  }

  .placeholder-state {
    text-align: center;
    padding: 6rem 2rem;
    color: #aaa;
  }
  .placeholder-state .icon { font-size: 3rem; margin-bottom: 1rem; }
  .placeholder-state p { font-size: 0.9rem; }

  @media print {
    body { background: white; }
    .topbar, .input-panel, .print-btn, .gen-btn { display: none !important; }
    .workspace { display: block; }
    .preview-panel { padding: 0; background: white; }
    .report { box-shadow: none; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="../index.html" class="back-link">← 返回首頁</a>
  <h1>📋 業績報告產生器</h1>
</div>

<div class="workspace">

  <!-- Input Panel -->
  <div class="input-panel">

    <div class="section-title">基本資訊</div>

    <div class="field">
      <label>公司 / 部門名稱</label>
      <input type="text" id="company" placeholder="例：佳瑪百貨 女裝部" value="佳瑪百貨" />
    </div>

    <div class="field-row">
      <div class="field">
        <label>報告期間</label>
        <input type="text" id="period" placeholder="例：2025年Q2" value="2025年Q2" />
      </div>
      <div class="field">
        <label>製表日期</label>
        <input type="date" id="report-date" />
      </div>
    </div>

    <div class="field">
      <label>製表人</label>
      <input type="text" id="author" placeholder="姓名與職稱" value="劉書銓 · 執行長室特別助理" />
    </div>

    <div class="section-title">業績數據</div>

    <div class="field-row">
      <div class="field">
        <label>本期實際營收（萬元）</label>
        <input type="number" id="actual-rev" placeholder="5340" value="5340" />
      </div>
      <div class="field">
        <label>目標營收（萬元）</label>
        <input type="number" id="target-rev" placeholder="5200" value="5200" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>去年同期營收（萬元）</label>
        <input type="number" id="prev-rev" placeholder="4820" value="4820" />
      </div>
      <div class="field">
        <label>本期來客數</label>
        <input type="number" id="customers" placeholder="42100" value="42100" />
      </div>
    </div>

    <div class="field">
      <label>客單價（元）</label>
      <input type="number" id="aov" placeholder="1268" value="1268" />
    </div>

    <div class="section-title">部門 / 品類業績（選填）</div>
    <p class="hint" style="margin-bottom:0.8rem">格式：部門名稱,實際,目標（每行一筆）</p>
    <div class="field">
      <textarea id="dept-data" rows="6">女裝,2010,1860
男裝,1180,1160
配件,860,905
美妝,760,690
餐飲,530,585</textarea>
    </div>

    <div class="section-title">亮點與行動方案</div>

    <div class="field">
      <label>本期亮點 / 成果（每行一條）</label>
      <textarea id="highlights" rows="4">Q2 整體達成率 103%，超標 159 萬
美妝區營收年增 12%，創歷史同期新高
週年慶前置行銷有效拉升來客數</textarea>
    </div>

    <div class="field">
      <label>下期行動方案（每行一條）</label>
      <textarea id="actions" rows="4">強化會員個人化推播，目標提升回購率 8%
優化餐飲動線與菜單結構，改善翻桌率
啟動 Q3 跨部門促銷聯合企劃</textarea>
    </div>

    <button class="gen-btn" onclick="generateReport()">📄 產生報告</button>
    <button class="print-btn" onclick="window.print()">🖨 列印 / 匯出 PDF</button>

  </div>

  <!-- Preview Panel -->
  <div class="preview-panel" id="preview-panel">
    <div class="placeholder-state">
      <div class="icon">📋</div>
      <p>填寫左側資料後<br/>點擊「產生報告」即可預覽</p>
    </div>
  </div>

</div>

<script>
// Set today's date as default
document.getElementById('report-date').value = new Date().toISOString().slice(0, 10);

function pct(a, b) { return b > 0 ? ((a / b) * 100).toFixed(1) : '—'; }
function diff(a, b) { return b > 0 ? (((a - b) / b) * 100).toFixed(1) : '—'; }
function fmtNum(n) { return Number(n).toLocaleString(); }

function badgeClass(rate) {
  const r = parseFloat(rate);
  if (r >= 100) return 'good';
  if (r >= 90)  return 'warn';
  return 'bad';
}

function barColor(rate) {
  const r = parseFloat(rate);
  if (r >= 100) return '#059669';
  if (r >= 90)  return '#d97706';
  return '#dc2626';
}

function generateReport() {
  const company   = document.getElementById('company').value   || '—';
  const period    = document.getElementById('period').value    || '—';
  const reportDate= document.getElementById('report-date').value;
  const author    = document.getElementById('author').value    || '—';
  const actualRev = parseFloat(document.getElementById('actual-rev').value) || 0;
  const targetRev = parseFloat(document.getElementById('target-rev').value) || 0;
  const prevRev   = parseFloat(document.getElementById('prev-rev').value)   || 0;
  const customers = parseFloat(document.getElementById('customers').value)   || 0;
  const aov       = parseFloat(document.getElementById('aov').value)         || 0;
  const deptRaw   = document.getElementById('dept-data').value.trim();
  const hiRaw     = document.getElementById('highlights').value.trim();
  const actRaw    = document.getElementById('actions').value.trim();

  const achieveRate = pct(actualRev, targetRev);
  const yoyRate     = diff(actualRev, prevRev);
  const gap         = (actualRev - targetRev).toFixed(0);

  // Parse depts
  const depts = deptRaw.split('\n').filter(l => l.trim()).map(line => {
    const [name, act, tgt] = line.split(',').map(s => s.trim());
    const r = pct(parseFloat(act), parseFloat(tgt));
    return { name, act: parseFloat(act) || 0, tgt: parseFloat(tgt) || 0, rate: r };
  });

  const maxAct = Math.max(...depts.map(d => d.act), 1);

  // Parse highlights & actions
  const highlights = hiRaw.split('\n').filter(l => l.trim());
  const actions    = actRaw.split('\n').filter(l => l.trim());

  const formattedDate = reportDate
    ? new Date(reportDate + 'T00:00:00').toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric' })
    : '—';

  const achieveNum  = parseFloat(achieveRate);
  const achieveCls  = achieveNum >= 100 ? 'up' : achieveNum >= 90 ? 'same' : 'down';
  const achieveTxt  = gap > 0 ? `超標 ${fmtNum(gap)} 萬` : gap < 0 ? `差距 ${fmtNum(Math.abs(gap))} 萬` : '剛好達標';

  const yoyNum  = parseFloat(yoyRate);
  const yoyCls  = yoyNum > 0 ? 'up' : yoyNum < 0 ? 'down' : 'same';
  const yoyTxt  = (yoyNum > 0 ? '▲ ' : yoyNum < 0 ? '▼ ' : '') + Math.abs(yoyNum) + '% YoY';

  const html = `
<div class="report">

  <div class="report-header">
    <div class="report-logo">${company} · 業績報告</div>
    <div class="report-title">${period} 業績分析報告</div>
    <div class="report-subtitle">Quarterly Performance Report</div>
    <div class="report-meta">
      <div class="report-meta-item"><strong>${achieveRate}%</strong>目標達成率</div>
      <div class="report-meta-item"><strong>${fmtNum(actualRev)} 萬</strong>實際營收</div>
      <div class="report-meta-item"><strong>${formattedDate}</strong>製表日期</div>
      <div class="report-meta-item"><strong>${author}</strong>製表人</div>
    </div>
  </div>

  <div class="report-body">

    <div class="kpi-summary">
      <div class="kpi-box highlight">
        <div class="kv">${achieveRate}%</div>
        <div class="kl">目標達成率</div>
        <div class="kd ${achieveCls}">${achieveTxt}</div>
      </div>
      <div class="kpi-box">
        <div class="kv">${yoyRate}%</div>
        <div class="kl">年度成長率</div>
        <div class="kd ${yoyCls}">${yoyTxt}</div>
      </div>
      <div class="kpi-box">
        <div class="kv">NT$${fmtNum(aov)}</div>
        <div class="kl">客單價</div>
        <div class="kd same">${fmtNum(customers)} 人次</div>
      </div>
    </div>

    ${depts.length > 0 ? `
    <div class="report-section">
      <h3>部門業績達成率</h3>
      ${depts.map(d => `
        <div class="bar-row">
          <div class="bar-name">${d.name}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.min((d.act/maxAct)*100,100)}%;background:${barColor(d.rate)}"></div>
          </div>
          <div class="bar-val">${d.rate}%</div>
        </div>
      `).join('')}
    </div>

    <div class="report-section">
      <h3>品類業績明細</h3>
      <table class="progress-table">
        <thead>
          <tr>
            <th>品類 / 部門</th>
            <th>實際（萬）</th>
            <th>目標（萬）</th>
            <th>達成率</th>
          </tr>
        </thead>
        <tbody>
          ${depts.map(d => `
            <tr>
              <td>${d.name}</td>
              <td>${fmtNum(d.act)}</td>
              <td>${fmtNum(d.tgt)}</td>
              <td><span class="badge ${badgeClass(d.rate)}">${d.rate}%</span></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    ` : ''}

    ${highlights.length > 0 ? `
    <div class="report-section">
      <h3>本期亮點</h3>
      <ul class="highlight-list">
        ${highlights.map(h => `<li>${h}</li>`).join('')}
      </ul>
    </div>
    ` : ''}

    ${actions.length > 0 ? `
    <div class="report-section">
      <h3>下期行動方案</h3>
      <div class="action-box">
        ${actions.map((a, i) => `
          <div class="action-item">
            <div class="action-num">${i+1}</div>
            <div>${a}</div>
          </div>
        `).join('')}
      </div>
    </div>
    ` : ''}

  </div>

  <div class="report-footer">
    <span>${company} · 內部文件</span>
    <span>${formattedDate} &nbsp;|&nbsp; ${author}</span>
  </div>

</div>
  `;

  document.getElementById('preview-panel').innerHTML = html;
}
</script>
</body>
</html>
